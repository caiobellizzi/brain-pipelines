name: Generate Repo Summary
on:
  workflow_call:
    secrets:
      NVIDIA_NIM_API_KEY:
        required: true

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect context
        run: |
          {
            echo "## README"
            cat README.md 2>/dev/null || echo "(no README)"
            echo ""
            echo "## Planning files"
            find .planning/ -name "*.md" 2>/dev/null | head -20 | xargs cat 2>/dev/null || echo "(no .planning/)"
            echo ""
            echo "## Recent git log (30d)"
            git log --oneline --since="30 days ago"
            echo ""
            echo "## File tree (depth 2)"
            find . -maxdepth 2 -name "*.md" | head -30
          } | head -c 24000 > /tmp/context.txt

      - name: Generate summary via NVIDIA NIM
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          REPO_FULL: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request, urllib.error

          with open('/tmp/context.txt') as f:
              context = f.read()

          repo_full = os.environ['REPO_FULL']          # e.g. caiobellizzi/ultra-agents-brain
          repo_name = repo_full.split('/')[-1]
          github_url = f"https://github.com/{repo_full}"

          prompt = (
              f"You are summarizing the GitHub repository '{repo_full}' for a personal "
              "second-brain knowledge vault. Write a concise prose summary (300-500 words) "
              "covering: Purpose, Stack, Architecture, Status, Recent activity, Key decisions, "
              f"Entry points, Links. The repository URL is {github_url} — use this exact URL "
              "as the base for any links you include (e.g. README is at "
              f"{github_url}/blob/main/README.md). "
              "Base it strictly on the provided context.\n\n"
              f"---\n{context}"
          )

          body = json.dumps({
              "model": "meta/llama-3.3-70b-instruct",
              "messages": [{"role": "user", "content": prompt}],
              "max_tokens": 1024
          }).encode()

          req = urllib.request.Request(
              "https://integrate.api.nvidia.com/v1/chat/completions",
              data=body,
              headers={
                  "Authorization": f"Bearer {os.environ['NVIDIA_NIM_API_KEY']}",
                  "Content-Type": "application/json",
              }
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.load(resp)
          except urllib.error.HTTPError as e:
              print(f"NIM API error {e.code}: {e.read().decode()}")
              raise

          summary = result['choices'][0]['message']['content']
          with open('SUMMARY.md', 'w') as f:
              f.write(summary)
          print(f"Summary written ({len(summary)} chars)")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: summary-${{ github.event.repository.name }}
          path: SUMMARY.md
